<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisco & Elyana — Save the Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --forest-deep: #0d2818;
            --forest: #1b4332;
            --forest-light: #2d5a45;
            --maroon: #722f37;
            --maroon-light: #a85d68;
            --cream: #faf9f7;
            --white: #ffffff;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--forest);
            background: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        /* Split layout container */
        .container {
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Left side - Content */
        .content-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            text-align: center;
            background: var(--white);
        }

        .announcement {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--forest-light);
            margin-bottom: 2rem;
        }

        .names {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 400;
            letter-spacing: 3px;
            line-height: 1.1;
            color: var(--forest-deep);
            margin-bottom: 0.5rem;
        }

        .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 400;
            display: block;
            font-size: 0.5em;
            margin: 0.5rem 0;
            color: var(--maroon);
        }

        .date-line {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--forest-light);
            margin-top: 1.5rem;
        }

        .divider {
            width: 50px;
            height: 1px;
            background: var(--maroon);
            margin: 2rem auto;
            opacity: 0.6;
        }

        .venue-section {
            margin-top: 2rem;
        }

        .venue-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 2vw, 1.3rem);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--forest-deep);
            margin-bottom: 0.5rem;
        }

        .venue-sub {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--forest-light);
            font-weight: 400;
        }

        .invitation-note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--maroon);
            font-style: italic;
            letter-spacing: 1px;
        }

        /* Right side - Image */
        .image-side {
            flex: 1;
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            position: relative;
        }

        .image-frame {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Mobile: Stack vertically */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .image-side {
                order: -1;
                padding: 2rem 2rem 1rem;
                min-height: auto;
            }

            .image-frame {
                max-width: 280px;
                aspect-ratio: 1/1;
            }

            .content-side {
                padding: 2rem;
            }

            .names {
                font-size: clamp(2rem, 8vw, 2.8rem);
                letter-spacing: 2px;
            }

            .announcement {
                font-size: 0.65rem;
                margin-bottom: 1.5rem;
            }

            .date-line {
                font-size: 0.85rem;
            }

            .divider {
                margin: 1.5rem auto;
            }

            .venue-section {
                margin-top: 1.5rem;
            }
        }

        /* Small mobile */
        @media (max-width: 400px) {
            .image-frame {
                max-width: 240px;
            }

            .names {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-side">
            <p class="announcement">We're Getting Married</p>
            
            <h1 class="names">
                ELY
                <span class="ampersand">&</span>
                FRANCISCO
            </h1>
            
            <p class="date-line">December 5, 2026 &nbsp;|&nbsp; Orlando, FL</p>
            
            <div class="divider"></div>
            
            <div class="venue-section">
                <p class="venue-name">Wanderlust Okto</p>
                <p class="venue-sub">6551 New Hope Rd, Orlando, FL 32824</p>
                <p class="invitation-note">Formal invitation to follow</p>
            </div>
        </div>

        <div class="image-side">
            <div class="image-frame">
                <img src="couple-photo.jpg" alt="Francisco and Elyana">
            </div>
        </div>
    </div>
</body>
</html>
